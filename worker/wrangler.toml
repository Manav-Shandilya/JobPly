name = "jobply-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Secrets (set via `wrangler secret put`):
#   ADZUNA_APP_ID
#   ADZUNA_APP_KEY
#   RAPIDAPI_KEY
#   JWT_SECRET

[[d1_databases]]
binding = "JOBPLY_DB"
database_name = "jobply-db"
database_id = "placeholder-replace-after-d1-create"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RESUME_BUCKET"
bucket_name = "jobply-resumes"
